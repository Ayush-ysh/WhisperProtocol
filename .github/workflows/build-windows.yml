name: Build Windows Application

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m venv backend/venv
          backend/venv/Scripts/python -m pip install --upgrade pip
          backend/venv/Scripts/pip install -e backend/
          backend/venv/Scripts/pip install pyinstaller cryptography reedsolo
        shell: bash

      - name: Build Standalone Python Engine for Windows
        run: |
          mkdir -p src-tauri/binaries
          cd backend
          ./venv/Scripts/pyinstaller --clean -y whisper.spec
          cp dist/whisper-engine.exe ../src-tauri/binaries/whisper-engine-x86_64-pc-windows-msvc.exe
        shell: bash

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Windows Desktop Application (.exe / .msi)
        run: npm run tauri build
        shell: bash

      - name: Upload Windows Desktop Installer & Binaries
        uses: actions/upload-artifact@v4
        with:
          name: WhisperProtocol-Windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/WhisperProtocol.exe
